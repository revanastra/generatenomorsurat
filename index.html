<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Nomor Surat HIMAKTU ITERA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F6; --paper-2:#E6EAF1; --surface:#FFFFFF; --field:#FFFFFF;
  --ink:#14213D; --muted:#5B6579; --line:#D3DAE6;
  --blue:#2446A6; --on-blue:#FFFFFF;
  --stamp:#B4342B; --stamp-bg:#FBEAE8;
  --ok:#1E7A4C; --ok-bg:#E8F5EE;
  --mark:#FFE98A;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0E1524; --paper-2:#131C31; --surface:#16203A; --field:#0F1830;
    --ink:#E6EBF5; --muted:#9AA6BD; --line:#2A3656;
    --blue:#8FAAFF; --on-blue:#0E1524;
    --stamp:#FF8F85; --stamp-bg:#3A1F24;
    --ok:#6FD3A0; --ok-bg:#12301F;
    --mark:#5A4E12;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 15px/1.5 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 56px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font:700 32px/1.05 'Bricolage Grotesque','Public Sans',system-ui,sans-serif;letter-spacing:-.02em}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.who-row{display:flex;flex-wrap:wrap;gap:12px}
.who{width:220px;max-width:100%}
h2{margin:0;font:600 19px/1.2 'Bricolage Grotesque','Public Sans',system-ui,sans-serif;letter-spacing:-.01em}

.grid{display:grid;grid-template-columns:minmax(320px,410px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:16px}
.f{min-width:0}
.f.full{grid-column:1 / -1}
label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.opt{font-weight:400;color:var(--muted)}
input,select{width:100%;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);font:inherit;font-size:14px}
input::placeholder{color:var(--muted);opacity:.85}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.strip-wrap{margin-top:18px}
.strip{display:flex;flex-wrap:wrap;gap:4px 0;padding:14px 12px;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper)}
.seg{display:flex;flex-direction:column;padding:0 2px;border-radius:3px}
.seg.hl{background:var(--mark);padding:0 5px}
.seg .v{font:600 18px/1.3 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.seg .l{font-size:11px;line-height:1.3;color:var(--muted)}
.seg.hl .l{color:var(--ink)}
.hint{margin:8px 0 0;font-size:12.5px;color:var(--muted)}

.btn{height:40px;padding:0 16px;border-radius:6px;border:1px solid transparent;font:600 14px 'Public Sans',system-ui,sans-serif;cursor:pointer}
.btn.primary{width:100%;margin-top:16px;background:var(--blue);color:var(--on-blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--paper-2)}
.btn.small{height:30px;padding:0 10px;font-size:13px;white-space:nowrap}
.btn.danger{color:var(--stamp)}
.status{min-height:20px;margin:10px 0 0;font-size:13px;color:var(--muted)}
.status.error{color:var(--stamp)}

.result{margin-top:14px;padding:14px;border:1.5px solid var(--ok);border-radius:6px;background:var(--ok-bg)}
.result .rl{margin:0;font-size:13px;font-weight:600;color:var(--ok)}
.result .rn{margin:4px 0 12px;font:600 17px/1.35 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere;user-select:all}

.reg-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px}
.count{margin:0;font-size:13px;color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.ctl select{width:auto;min-width:150px}
.ctl .search{flex:1 1 200px;min-width:160px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:740px}
th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper-2);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
.c-nomor{min-width:250px;max-width:340px}
.nomor{display:block;font:600 13.5px/1.4 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.jn{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.c-tgl{white-space:nowrap}
.perihal{font-weight:500}
.tujuan{margin-top:2px;font-size:12.5px;color:var(--muted)}
.c-aksi{white-space:nowrap}
.c-aksi .btn+.btn{margin-left:6px}
.is-batal .nomor{text-decoration:line-through;color:var(--muted)}
.is-batal .perihal{color:var(--muted)}
.stamp{display:inline-block;margin-top:5px;padding:0 6px;border:1.5px solid var(--stamp);border-radius:3px;color:var(--stamp);font-size:12px;font-weight:700;transform:rotate(-3deg)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}

.banner{margin:0 0 16px;padding:12px 14px;border:1px solid var(--stamp);border-radius:6px;background:var(--stamp-bg);color:var(--ink);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr-copy{position:fixed;top:0;left:0;opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 14px;border-radius:6px;background:var(--ink);color:var(--paper);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Nomor surat</h1>
      <p class="sub">Departemen Kesekretariatan, HIMAKTU ITERA</p>
    </div>
    <div class="who-row">
      <div class="who">
        <label for="nama">Nama kamu</label>
        <input id="nama" maxlength="80" autocomplete="name" placeholder="Nama lengkap atau panggilan">
      </div>
      <div class="who">
        <label for="kode">Kode akses</label>
        <input id="kode" type="password" maxlength="80" autocomplete="off" placeholder="Dari sekretaris">
      </div>
    </div>
  </header>

  <div id="banner"></div>

  <main class="grid">
    <section class="panel" aria-labelledby="h-compose">
      <h2 id="h-compose">Buat nomor baru</h2>
      <div class="fields">
        <div class="f full"><label for="keluar">Kode surat keluar</label><select id="keluar"></select></div>
        <div class="f full"><label for="jenis">Jenis surat</label><select id="jenis"></select></div>
        <div class="f"><label for="tanggal">Tanggal surat</label><input type="date" id="tanggal"></div>
        <div class="f"><label for="unit">Unit penerbit</label><input id="unit" value="BPH" maxlength="12" autocomplete="off"></div>
        <div class="f full"><label for="perihal">Perihal</label><input id="perihal" maxlength="200" autocomplete="off" placeholder="Contoh: Undangan rapat evaluasi program kerja"></div>
        <div class="f full"><label for="tujuan">Tujuan surat <span class="opt">(opsional)</span></label><input id="tujuan" maxlength="160" autocomplete="off" placeholder="Contoh: Ketua Program Studi Sains Aktuaria"></div>
      </div>

      <div class="strip-wrap">
        <div class="strip" id="strip" aria-label="Pratinjau nomor surat"></div>
        <p class="hint" id="seqNote"></p>
      </div>

      <button class="btn primary" id="issue" type="button" disabled>Ambil nomor</button>
      <p class="status" id="status" role="status">Memuat rekap...</p>
      <div id="result" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="h-reg">
      <div class="reg-head">
        <h2 id="h-reg">Rekap surat keluar</h2>
        <p class="count" id="count"></p>
      </div>
      <div class="ctl">
        <select id="fTahun" aria-label="Filter tahun"></select>
        <select id="fJenis" aria-label="Filter jenis surat"></select>
        <input class="search" id="fQ" type="search" placeholder="Cari nomor, perihal, atau tujuan" aria-label="Cari surat" autocomplete="off">
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th scope="col">Nomor</th><th scope="col">Tanggal</th><th scope="col">Perihal</th><th scope="col">Dibuat oleh</th><th scope="col"><span class="sr">Aksi</span></th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* Tempel alamat web app Apps Script (berakhiran /exec) di antara tanda kutip. */
var API_URL='https://script.google.com/macros/s/AKfycbxinpw_QbCyYpW_DZNx77wyvIY773edW3JrQP3MutoF7ALRDoRFF4VXWrgoqNMFSJUD/exec';

var JENIS=[
  ['01','Surat Keputusan','SKep'],['02','Surat Undangan','SU'],['03','Surat Permohonan','SPm'],
  ['04','Surat Pemberitahuan','SPb'],['05','Surat Peminjaman','SPp'],['06','Surat Pernyataan','SPn'],
  ['07','Surat Kuasa','SK'],['08','Surat Tugas','ST'],['09','Surat Keterangan','SKet'],
  ['10','Surat Rekomendasi','SR'],['11','Surat Balasan','SB'],
  ['12','Surat MoU','MoU']
];
var KELUAR=[['A','Internal himpunan'],['B','Internal kampus'],['C','Eksternal kampus']];
var ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
var BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

var state={docs:[],loaded:false,busy:false,
  filter:{tahun:String(new Date().getFullYear()),jenis:'',q:''}};

function $(id){return document.getElementById(id);}
var el={};
['keluar','jenis','tanggal','unit','perihal','tujuan','nama','kode','strip','seqNote','issue','status','result','fTahun','fJenis','fQ','tbody','count','banner','toast'].forEach(function(k){el[k]=$(k);});

function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs){for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}}
  for(var i=2;i<arguments.length;i++){var kid=arguments[i];
    if(kid==null||kid===false)continue;
    e.append(kid.nodeType?kid:document.createTextNode(String(kid)));}
  return e;
}
function pad(n){return String(n).padStart(3,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return s||'';return (+s.slice(8,10))+' '+BLN[+s.slice(5,7)-1]+' '+s.slice(0,4);}
function cleanUnit(v){return String(v||'').replace(/[^A-Za-z0-9-]/g,'').toUpperCase()||'BPH';}
function msg(e){
  if(e&&e.name==='TypeError')return 'Tidak bisa terhubung ke Apps Script. Periksa koneksi dan alamat web app di API_URL.';
  var m=(e&&e.message)?String(e.message):'';
  return m.replace(/^Error:\s*/,'')||'Terjadi kesalahan. Coba lagi.';
}

/* panggilan ke Apps Script (web app) lewat fetch */
function configured(){return typeof API_URL==='string'&&API_URL.indexOf('https://script.google.com/')===0;}
async function api(body){
  body.kode=el.kode.value.trim();
  var res=await fetch(API_URL,{method:'POST',body:JSON.stringify(body),redirect:'follow'});
  var json=await res.json();
  if(!json.ok)throw new Error(json.error||'Permintaan ditolak.');
  return json;
}
function gs(fn,a,b){
  if(fn==='getData')return api({action:'list'});
  if(fn==='issueNumber')return api({action:'issue',p:a});
  if(fn==='setStatus')return api({action:'status',nomor:a,batal:b});
  return Promise.reject(new Error('Aksi tidak dikenal.'));
}

var toastTimer=0;
function toast(m){el.toast.textContent=m;el.toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.toast.classList.remove('show');},2800);}

/* nama pembuat diingat di browser */
function loadName(){try{el.nama.value=localStorage.getItem('himaktu_nama')||'';el.kode.value=localStorage.getItem('himaktu_kode')||'';}catch(e){}}
function saveName(){try{localStorage.setItem('himaktu_nama',el.nama.value.trim());localStorage.setItem('himaktu_kode',el.kode.value.trim());}catch(e){}}

/* ---------- format nomor ---------- */
function parts(f){
  return [
    {v:f.kodeKeluar,l:'keluar'},
    {v:(f.seq==null?'...':pad(f.seq))+'.'+f.kodeJenis,l:'urutan.jenis',hl:true},
    {v:f.singkatan,l:'singkatan'},
    {v:f.unit,l:'unit'},
    {v:'HIMAKTU',l:'himpunan'},
    {v:'ITERA',l:'kampus'},
    {v:ROMAN[f.bulan-1],l:'bulan'},
    {v:String(f.tahun),l:'tahun'}
  ];
}
function readForm(){
  var jn=JENIS.filter(function(j){return j[0]===el.jenis.value;})[0]||JENIS[1];
  var t=el.tanggal.value;
  var ok=/^\d{4}-\d{2}-\d{2}$/.test(t)&&+t.slice(5,7)>=1&&+t.slice(5,7)<=12;
  return {
    kodeKeluar:el.keluar.value,kodeJenis:jn[0],jenisNama:jn[1],singkatan:jn[2],
    unit:cleanUnit(el.unit.value),tanggal:t,tanggalOk:ok,
    bulan:ok?+t.slice(5,7):null,tahun:ok?+t.slice(0,4):null,
    perihal:el.perihal.value.trim(),tujuan:el.tujuan.value.trim()
  };
}
function nextSeqLocal(tahun,kode){
  var m=0;
  state.docs.forEach(function(d){if(d.tahun===tahun&&d.kodeJenis===kode&&d.seq>m)m=d.seq;});
  return m+1;
}

/* ---------- pratinjau ---------- */
function renderPreview(){
  var f=readForm();
  el.strip.textContent='';
  if(!f.tanggalOk){
    el.strip.append(h('span',{class:'hint'},'Isi tanggal surat untuk melihat nomor.'));
    el.seqNote.textContent='';
    return;
  }
  f.seq=state.loaded?nextSeqLocal(f.tahun,f.kodeJenis):null;
  var list=parts(f);
  list.forEach(function(p,i){
    el.strip.append(h('div',{class:'seg'+(p.hl?' hl':'')},
      h('span',{class:'v'},p.v+(i<list.length-1?'/':'')),
      h('span',{class:'l'},p.l)));
  });
  el.seqNote.textContent=(state.loaded?'Urutan '+pad(f.seq)+' untuk '+f.jenisNama+' tahun '+f.tahun+'. ':'')+
    'Nomor final ditetapkan saat kamu menekan Ambil nomor.';
}

/* ---------- ambil nomor ---------- */
async function issue(){
  if(state.busy)return;
  var f=readForm();
  var nama=el.nama.value.trim();
  el.status.className='status';
  if(!configured()){el.status.className='status error';el.status.textContent='Alamat web app Apps Script belum diisi di index.html (API_URL).';return;}
  if(!nama){el.status.className='status error';el.status.textContent='Isi nama kamu di pojok kanan atas dulu.';el.nama.focus();return;}
  if(!el.kode.value.trim()){el.status.className='status error';el.status.textContent='Isi kode akses di pojok kanan atas dulu.';el.kode.focus();return;}
  if(!f.tanggalOk){el.status.className='status error';el.status.textContent='Isi tanggal surat dengan benar.';el.tanggal.focus();return;}
  if(!f.perihal){el.status.className='status error';el.status.textContent='Isi perihal surat dulu.';el.perihal.focus();return;}
  saveName();
  state.busy=true;syncButton();
  el.status.textContent='Mengambil nomor...';
  try{
    var rec=await gs('issueNumber',{
      kodeKeluar:f.kodeKeluar,kodeJenis:f.kodeJenis,tanggal:f.tanggal,unit:f.unit,
      perihal:f.perihal,tujuan:f.tujuan,oleh:nama
    });
    el.status.textContent='';
    el.result.replaceChildren(h('div',{class:'result'},
      h('p',{class:'rl'},'Nomor diambil dan tercatat di rekap'),
      h('p',{class:'rn'},rec.nomor),
      h('button',{class:'btn ghost small',type:'button',onclick:function(){copy(rec.nomor);}},'Salin nomor')));
    el.perihal.value='';el.tujuan.value='';
    await refresh(true);
  }catch(e){
    el.status.className='status error';
    el.status.textContent=msg(e);
  }finally{
    state.busy=false;syncButton();
  }
}

/* ---------- salin ---------- */
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('Nomor disalin');return;}catch(e){}
  try{
    var ta=h('textarea',{class:'sr-copy',readonly:true,'aria-hidden':'true'});
    ta.value=text;document.body.append(ta);ta.select();
    var ok=document.execCommand('copy');ta.remove();
    if(ok){toast('Nomor disalin');return;}
  }catch(e){}
  toast('Tidak bisa menyalin otomatis. Blok nomornya lalu salin manual.');
}

/* ---------- rekap ---------- */
function filtered(){
  var f=state.filter,q=f.q.trim().toLowerCase();
  return state.docs.filter(function(d){
    if(f.tahun!=='all'&&String(d.tahun)!==f.tahun)return false;
    if(f.jenis&&d.kodeJenis!==f.jenis)return false;
    if(q){return [d.nomor,d.perihal,d.tujuan].some(function(s){return String(s||'').toLowerCase().indexOf(q)>-1;});}
    return true;
  });
}

function renderFilters(){
  var years=Array.from(new Set(state.docs.map(function(d){return d.tahun;}).filter(function(y){return y>0;}).concat([new Date().getFullYear()]))).sort(function(a,b){return b-a;});
  var sigY=years.join(',');
  if(el.fTahun.dataset.sig!==sigY){
    el.fTahun.textContent='';
    el.fTahun.append(h('option',{value:'all'},'Semua tahun'));
    years.forEach(function(y){el.fTahun.append(h('option',{value:String(y)},String(y)));});
    el.fTahun.dataset.sig=sigY;
  }
  el.fTahun.value=state.filter.tahun;

  var inYear=state.docs.filter(function(d){return state.filter.tahun==='all'||String(d.tahun)===state.filter.tahun;});
  var counts={};inYear.forEach(function(d){counts[d.kodeJenis]=(counts[d.kodeJenis]||0)+1;});
  var sigJ=JSON.stringify(counts)+'|'+inYear.length;
  if(el.fJenis.dataset.sig!==sigJ){
    el.fJenis.textContent='';
    el.fJenis.append(h('option',{value:''},'Semua jenis ('+inYear.length+')'));
    JENIS.forEach(function(j){el.fJenis.append(h('option',{value:j[0]},j[1]+' ('+(counts[j[0]]||0)+')'));});
    el.fJenis.dataset.sig=sigJ;
  }
  el.fJenis.value=state.filter.jenis;
}

function nomorEl(n){
  var s=h('span',{class:'nomor'});
  var segs=String(n||'').split('/');
  segs.forEach(function(p,i){
    s.append(p+(i<segs.length-1?'/':''));
    if(i<segs.length-1)s.append(document.createElement('wbr'));
  });
  return s;
}

function renderTable(){
  var rows=filtered();
  el.tbody.textContent='';
  var nb=rows.filter(function(d){return d.batal;}).length;
  el.count.textContent=state.loaded?(rows.length+' surat'+(nb?', '+nb+' dibatalkan':'')):'';

  if(!state.loaded){
    el.tbody.append(h('tr',null,h('td',{class:'empty',colspan:'5'},'Menunggu kode akses dan data rekap...')));
    return;
  }
  if(!rows.length){
    var anyFilter=state.filter.q.trim()||state.filter.jenis||state.filter.tahun!=='all';
    el.tbody.append(h('tr',null,h('td',{class:'empty',colspan:'5'},
      anyFilter?'Tidak ada surat yang cocok dengan filter ini.':'Belum ada surat. Ambil nomor pertama lewat panel di sebelah kiri.')));
    return;
  }
  rows.forEach(function(d){
    var actions=h('td',{class:'c-aksi'},
      h('button',{class:'btn ghost small',type:'button',onclick:function(){copy(d.nomor);}},'Salin'));
    if(d.batal){
      actions.append(h('button',{class:'btn ghost small',type:'button',onclick:function(){setBatal(d,false);}},'Aktifkan lagi'));
    }else{
      var armed=false,timer=0;
      var b=h('button',{class:'btn ghost small danger',type:'button'},'Batalkan');
      b.addEventListener('click',function(){
        if(!armed){armed=true;b.textContent='Yakin batalkan?';clearTimeout(timer);timer=setTimeout(function(){armed=false;b.textContent='Batalkan';},3500);return;}
        clearTimeout(timer);setBatal(d,true);
      });
      actions.append(b);
    }
    el.tbody.append(h('tr',{class:d.batal?'is-batal':''},
      h('td',{class:'c-nomor'},nomorEl(d.nomor),h('span',{class:'jn'},d.jenis||''),d.batal?h('span',{class:'stamp'},'Batal'):null),
      h('td',{class:'c-tgl'},fmtDate(d.tanggal)),
      h('td',null,h('div',{class:'perihal'},d.perihal||''),d.tujuan?h('div',{class:'tujuan'},'Kepada: '+d.tujuan):null),
      h('td',null,d.oleh||'-'),
      actions));
  });
}

async function setBatal(d,val){
  try{
    await gs('setStatus',d.nomor,val);
    toast(val?'Nomor dibatalkan':'Nomor diaktifkan lagi');
    await refresh(true);
  }catch(e){toast(msg(e));}
}

/* ---------- muat data ---------- */
function banner(m){el.banner.replaceChildren(m?h('p',{class:'banner',role:'alert'},m):'');}

async function refresh(silent){
  if(!configured()){
    banner('Alamat web app Apps Script belum diisi. Buka index.html, cari API_URL di bagian script, lalu tempel alamat web app (berakhiran /exec).');
    return;
  }
  if(!el.kode.value.trim()){
    el.status.className='status';el.status.dataset.k='load';
    el.status.textContent='Isi kode akses di pojok kanan atas untuk memuat rekap.';
    return;
  }
  try{
    var data=await gs('getData');
    state.docs=data.rows.slice().sort(function(a,b){return a.dicatat<b.dicatat?1:a.dicatat>b.dicatat?-1:0;});
    state.loaded=true;
    banner('');
    if(!state.busy&&el.status.dataset.k==='load'){el.status.className='status';el.status.textContent='';el.status.dataset.k='';}
    renderAll();
  }catch(e){
    if(!silent||!state.loaded){
      banner('Tidak bisa memuat rekap. '+msg(e));
      el.status.className='status error';
      el.status.textContent='';
    }
  }
}

function syncButton(){
  el.issue.disabled=!(state.loaded&&!state.busy);
  el.issue.textContent=state.busy?'Mengambil nomor...':'Ambil nomor';
}
function renderAll(){renderPreview();renderFilters();renderTable();syncButton();}

/* ---------- mulai ---------- */
function setup(){
  KELUAR.forEach(function(k){el.keluar.append(h('option',{value:k[0]},k[0]+'  '+k[1]));});
  JENIS.forEach(function(j){el.jenis.append(h('option',{value:j[0]},j[0]+'  '+j[1]+' ('+j[2]+')'));});
  el.keluar.value='B';el.jenis.value='02';el.tanggal.value=todayStr();
  loadName();

  ['keluar','jenis','tanggal'].forEach(function(k){el[k].addEventListener('change',renderPreview);});
  el.unit.addEventListener('input',renderPreview);
  el.unit.addEventListener('blur',function(){el.unit.value=cleanUnit(el.unit.value);renderPreview();});
  el.nama.addEventListener('change',saveName);
  el.kode.addEventListener('change',function(){saveName();refresh(false);});
  el.status.dataset.k='load';
  el.issue.addEventListener('click',issue);
  el.perihal.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();issue();}});

  el.fTahun.addEventListener('change',function(){state.filter.tahun=el.fTahun.value;renderFilters();renderTable();});
  el.fJenis.addEventListener('change',function(){state.filter.jenis=el.fJenis.value;renderTable();});
  el.fQ.addEventListener('input',function(){state.filter.q=el.fQ.value;renderTable();});

  renderAll();
  refresh(false);
  // segarkan otomatis supaya nomor dari anggota lain ikut terlihat
  setInterval(function(){if(!document.hidden&&!state.busy)refresh(true);},30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&!state.busy)refresh(true);});
}
setup();
})();
</script>
</body>
</html>
